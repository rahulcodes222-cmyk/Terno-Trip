version: "3.9"

# ─── Development Orchestration ───────────────────────────────────────────────
# During local development, run services directly with: npm run dev (from root)
# This file provides MongoDB and is useful for CI or full-stack Docker runs.
#
# Quick start:
#   docker-compose up -d mongodb     # start only the database
#   npm run dev                       # start all services with hot-reload

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: terno_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      # Remove these lines if your MONGODB_URI uses Atlas (no local auth needed)
      MONGO_INITDB_ROOT_USERNAME: terno
      MONGO_INITDB_ROOT_PASSWORD: terno_dev_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

